name: Testes

on:
  push:
  pull_request:

jobs:
  node-and-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: sandbox
          MYSQL_USER: sandbox
          MYSQL_PASSWORD: sandbox-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
    env:
      MYSQL_TEST_HOST: 127.0.0.1
      MYSQL_TEST_PORT: 3306
      MYSQL_TEST_USER: sandbox
      MYSQL_TEST_PASSWORD: sandbox-test-password
      MYSQL_TEST_DATABASE: sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check src/server.js
      - run: node --check src/portal/app.js
      - run: docker compose config --quiet
