services:
  super-sandbox:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      DATA_DIR: /data
      PUBLIC_BASE_DOMAIN: localhost
      PUBLIC_SCHEME: http
      PUBLIC_PORT: "8080"
    volumes:
      - sandbox_data:/data
    restart: unless-stopped

volumes:
  sandbox_data:
